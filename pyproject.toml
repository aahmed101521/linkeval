[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkeval"
version = "0.0.1"
description = "Evaluation and uncertainty quantification for entity resolution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Abrar Ahmed" }
]
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
pandas = [
    "pandas",
]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
    "pre-commit",
    "build",
]

[tool.hatch.build.targets.wheel]
packages = ["src/linkeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=linkeval",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["linkeval"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/linkeval"]

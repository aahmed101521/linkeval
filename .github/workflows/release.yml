name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build distribution
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Store distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs:
      - release-please
      - build
    runs-on: ubuntu-latest
    environment: testpypi

    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Verify TestPyPI installation
    needs:
      - release-please
      - publish-testpypi
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download package from TestPyPI
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          mkdir testpypi-download
          for attempt in 1 2 3 4 5 6; do
            python -m pip download \
              --no-deps \
              --index-url https://test.pypi.org/simple/ \
              "linkeval==$VERSION" \
              --dest testpypi-download && break
            echo "TestPyPI package not visible yet; retrying in 10 seconds."
            sleep 10
          done
          test -n "$(find testpypi-download -type f -print -quit)"

      - name: Install downloaded TestPyPI package
        run: python -m pip install testpypi-download/*

      - name: Verify installed version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          python -c "from importlib.metadata import version; assert version('linkeval') == '$VERSION'"

  publish-pypi:
    name: Publish to PyPI
    needs:
      - release-please
      - build
      - verify-testpypi
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi:
    name: Verify PyPI installation
    needs:
      - release-please
      - publish-pypi
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install released package
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            python -m pip install "linkeval==$VERSION" && break
            echo "PyPI package not visible yet; retrying in 10 seconds."
            sleep 10
          done

      - name: Verify installed version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          python -c "from importlib.metadata import version; assert version('linkeval') == '$VERSION'"

name: User story
description: A planned increment of user-facing or maintainer-facing value
title: "[Story] "
labels: []
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: State who needs what and why.
      placeholder: "As a [who], I want [what], so that [why]."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List explicit, checkable conditions for completion.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: dropdown
    id: estimate
    attributes:
      label: Estimate
      description: Fibonacci story-point estimate. Stories above 5 must be split.
      options:
        - "1"
        - "2"
        - "3"
        - "5"
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List unresolved dependencies, or write None.
      placeholder: "None"
    validations:
      required: true
